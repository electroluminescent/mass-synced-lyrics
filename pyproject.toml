[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-synced-lyrics"
dynamic = ["version"]
description = "Embed time-synced (LRC) lyrics into a music library from sidecar .lrc files, your own LRC collection, or LRCLIB."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "mutagen>=1.47",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "charset-normalizer>=3.0",
    "Send2Trash>=1.8",
    "av>=12",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest"]
build = ["pyinstaller"]

[project.scripts]
mass-synced-lyrics = "mass_synced_lyrics.cli:main"

[project.gui-scripts]
mass-synced-lyrics-backend = "mass_synced_lyrics.server:main"

[tool.setuptools.dynamic]
version = { attr = "mass_synced_lyrics.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mass_synced_lyrics = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
