name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Test (Linux, GUI under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -k "not gui"

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write build info
        env:
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
        run: python scripts/write_buildinfo.py --homepage "${{ github.server_url }}/${{ github.repository }}"
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Python python -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: MassSyncedLyrics-windows
          path: dist/MassSyncedLyrics-*-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MassSyncedLyrics-*-windows.zip
          generate_release_notes: true
